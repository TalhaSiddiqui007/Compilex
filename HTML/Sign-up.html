<!DOCTYPE html>
<html>
    <head>
        <title>Sign-Up</title>
        <link rel="StyleSheet" href="/CSS/Sign-up.css">
    </head>
    <body>
        <div>
            <h1 class="signup-container">Sign up</h1>
            <div class="details">
                <input placeholder="Name" class="details-input">
                <input placeholder="Email" class="details-input">
                <input placeholder="Password" class="details-input">
                
                <button class="signup-button">
                    Sign up
                </button>

                 <p class="login">
                    Already have an account? Log in
                </p>

                <div class="or-divider">
                    <span></span>
                    <p>or</p>
                    <span></span>
                </div>

                <button class="Google-button">
                    Sign up with Google
                </button>
            </div>
            
           
        </div>
        
        <script src="Sign-Up-page/Sign-up.js"></script>
    </body>
</html>
