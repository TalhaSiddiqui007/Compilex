<!DOCTYPE html>
<html>
    <head>
        <title>Sign-Up</title>
        <link rel="StyleSheet" href="/CSS/Sign-up.css">
    </head>
    <body>
        <p class="compilex-class">
            CompileX
        </p>
        <div class="signup-container">
            <p class="signup-title">Sign up</p>
            <div class="details">
                <input placeholder="Name" class="details-input">
                <input type="email" placeholder="Email" class="details-input">
                <input type="password" placeholder="Password" class="details-input">
                
                <form id="signupForm">
                     <button class="signup-button">
                        Sign up
                    </button>
                </form>
               

                 <p class="login">
                    Already have an account? Log in
                </p>

                <div class="or-divider">
                    <span></span>
                    <p>or</p>
                    <span></span>
                </div>
                
                <button class="Google-button" onclick="
                    greeting();
                ">
                    <img src="/Icons/google-logo.svg" class="btn-icon" alt="Google logo">
                    Sign up with Google
                </button>
            </div>
            
           
        </div>
        
        <script src="/Scripts/Sign-up.js"></script>
    </body>
</html>
