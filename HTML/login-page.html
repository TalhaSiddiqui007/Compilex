<!DOCTYPE html>
<html>
    <head>
        <title>CompileX</title>
        <link rel="StyleSheet" href="/CSS/login-page.css">
    </head>
    <body>
        <p class="compilex-class">
            CompileX
        </p>
        <div class="signup-container">
            <p class="signup-title">Welcome Back</p>
            <div class="details">
                <input placeholder="Username" class="details-input">
                <input type="password" placeholder="Password" class="details-input">

                <p >
                    <a href="/HTML/login-page.html" class="forgot-password">
                        forgot password
                    </a>
                </p> 
                
                <form id="signupForm">
                     <button class="login-button">
                        login
                    </button>
                </form>
               
                
                

                <div class="or-divider">
                    <span></span>
                    <p>or</p>
                    <span></span>
                </div>
                
                <button class="Google-button" onclick="
                    greeting();
                ">
                    <img src="/Icons/google-logo.svg" class="btn-icon" alt="Google logo">
                    Sign up with Google
                </button>
            </div>
            
            <div class="signup-class">
                <p>
                    Don't have an account? 
                </p>

                <p >
                    <a href="/HTML/Sign-up.html" class="signup-page-link">
                        Sign up
                    </a>
                    
                </p> 
            </div>
           
        </div>
        
        <script src="/Scripts/Sign-up.js"></script>
    </body>
</html>
